# HTTPS front door for the other apps on this box.
#
# Each app keeps its existing plain-HTTP port working exactly as before; these
# blocks add a trusted https:// hostname in front of it. Nothing here changes
# the apps themselves.
#
#   webapp     -> 127.0.0.1:2026   (pm2 web-app, notification panel)
#   atompos    -> 127.0.0.1:3031   (pm2 atom_pos)
#   leadz      -> 127.0.0.1:3041   (pm2 leadz)
#   idine      -> 127.0.0.1:6062   (pm2 idine)
#   idinelite  -> 127.0.0.1:6061   (pm2 idine_lite)
#   pixal      -> 127.0.0.1:8050   (nginx + php-fpm)
#   trackup    -> 127.0.0.1:8080   (nginx + php-fpm)
#   venuepro   -> 127.0.0.1:8082   (nginx + php-fpm)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webapp.69-169-97-195.sslip.io;
    include /etc/nginx/snippets/tls.conf;
    add_header Strict-Transport-Security "max-age=63072000" always;
    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:2026;
    }
}

