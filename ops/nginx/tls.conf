# Shared TLS settings. Trusted Let's Encrypt cert covering every
# <app>.69-169-97-195.sslip.io hostname on this box.
ssl_certificate     /etc/letsencrypt/live/skillton/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/skillton/privkey.pem;

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# No ssl_stapling: Let's Encrypt no longer publishes an OCSP responder URL,
# so nginx would only warn about it on every reload.
