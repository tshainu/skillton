# Skillton — AI recruitment platform.
#
# HTTPS is a hard requirement here, not a nicety: browsers only grant
# camera/microphone access on a secure origin, so the AI interview room cannot
# run over plain HTTP. Candidates must be sent the https:// link.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillton.69-169-97-195.sslip.io;

    include /etc/nginx/snippets/tls.conf;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # The interview room needs its own camera and mic; nothing else does.
    add_header Permissions-Policy        "camera=(self), microphone=(self), display-capture=(self)" always;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:8888;
    }
}

# Bare-IP access (https://69.169.97.195) and any unmatched hostname land here.
# Served with the self-signed cert, because a public CA will not certify an IP
# address — expect a browser warning on this one. Use the sslip.io hostname for
# anything candidate-facing.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://127.0.0.1:8888;
    }
}
