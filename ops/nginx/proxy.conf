# Shared reverse-proxy settings for the apps behind HTTPS on this box.
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# The apps trust this to decide they are already on HTTPS — without it they
# redirect back to http and loop.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / upgrade passthrough.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Streaming responses (AI copilot SSE, live transcripts) must not be buffered,
# or the client sees nothing until the stream closes.
proxy_buffering off;
proxy_cache off;
proxy_set_header X-Accel-Buffering no;

# Long-lived connections: an interview session outlives a 60s default.
proxy_connect_timeout 30s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

# CV and recording uploads.
client_max_body_size 100M;
client_body_timeout  300s;
